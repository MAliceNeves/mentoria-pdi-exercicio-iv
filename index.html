<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14231c">
  <meta name="description" content="An intimate journey through a garden. Scroll to enter, wander, and discover the view beyond.">
  <title>Íntimo — A garden within</title>
  <link rel="stylesheet" href="style.css">
  <script src="experience.js" defer></script>
</head>
<body>
  <main id="garden" aria-label="An interactive journey through the garden">
    <div class="viewport">
      <div class="scene"><img src="assets/gate.png" alt="An ornate open gate inviting you into the garden" fetchpriority="high"></div>
      <div class="scene"><img src="assets/fountain.png" alt="A stone fountain nestled among the trees"></div>
      <div class="scene scene-tree"><img src="assets/tree.png" alt="An old tree stretching upwards into a deep green canopy"></div>
      <div class="scene scene-tunnel"><img src="assets/tunel.png" alt="A narrow path through a tunnel of foliage"></div>
      <div class="scene scene-final"><img src="assets/final.png" alt="An expansive view of a winding river and distant hills beneath a golden sky"></div>
      <div id="blackout" aria-hidden="true"></div>
    </div>
  </main>
</body>
</html>
